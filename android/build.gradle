group 'fman.ge.smart_auth'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ ships built-in Kotlin support; only apply KGP when built-in Kotlin is
// not in effect (older AGP, or projects opting out via android.builtInKotlin=false).
// See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 && project.findProperty('android.builtInKotlin') != 'false'
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'fman.ge.smart_auth'
    }

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // android.kotlinOptions only exists when KGP is applied; with AGP 9 built-in
    // Kotlin, jvmTarget follows compileOptions.targetCompatibility.
    if (!builtInKotlin) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11.toString()
        }
    }

    sourceSets {
        // Kotlin sources must go to the kotlin source set; AGP 9 built-in Kotlin
        // does not compile Kotlin files added to the java source set.
        main.kotlin.directories.add('src/main/kotlin')
    }

    defaultConfig {
        minSdkVersion 16
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation("androidx.concurrent:concurrent-futures-ktx:1.2.0")
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation("androidx.credentials:credentials:1.5.0-beta01")
    // optional - needed for credentials support from play services, for devices running
    // Android 13 and below.
    implementation("androidx.credentials:credentials-play-services-auth:1.5.0-beta01")
}

name: Create Release & Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.2.3). Leave empty to use version from pubspec.yaml'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate tests and pubspec without creating tag/release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions: write
    uses: Tkko/better-actions/.github/workflows/create-release.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      dry_run: ${{ inputs.dry_run }}
      # The plugin is Android-only.
      platforms: android
      integration-test-target: integration_test/smart_auth_test.dart

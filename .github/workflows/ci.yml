name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: Tkko/better-actions/.github/workflows/ci.yml@main
    with:
      # The plugin is Android-only, and integration-android-sms below runs the
      # whole integration test file, so the shared platform jobs are skipped.
      platforms: none

  # The SMS and phone number hint tests need Google Play services and something
  # to happen outside the app (an SMS to arrive, a dialog to be dismissed), so
  # they can't run through the shared workflow. The script sends the SMS and
  # taps the dialogs, see example/integration_test/run_sms_tests.sh.
  integration-android-sms:
    name: Integration Tests (Android Emulator, SMS and hint)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tkko/better-actions
          ref: main
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Flutter package
        uses: ./.github/workflow-actions/.github/actions/setup-flutter
        with:
          working-directory: example
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run SMS and phone number hint tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: example
          # Play Store updates Play services a few minutes after boot. The update
          # kills the Play services processes, which closes the consent dialog
          # and drops the SMS retriever registration mid-test, so disable it first.
          script: >-
            bash -o pipefail -c '
            adb -s emulator-5554 shell pm disable-user --user 0 com.android.vending;
            timeout --signal=KILL 15m bash integration_test/run_sms_tests.sh emulator-5554 2>&1 | tee "$RUNNER_TEMP/sms-tests.log";
            status=$?;
            if [ "$status" -ne 0 ]; then
            adb -s emulator-5554 exec-out screencap -p > "$RUNNER_TEMP/sms-failure.png";
            adb -s emulator-5554 logcat -d > "$RUNNER_TEMP/sms-logcat.txt";
            adb -s emulator-5554 logcat -d | grep -E "Pinput/SmartAuth|SmsRetriever|UserConsent|PhoneNumberHint" | tail -60;
            fi;
            exit "$status"
            '
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-sms-test-diagnostics
          path: |
            ${{ runner.temp }}/sms-tests.log
            ${{ runner.temp }}/sms-logcat.txt
            ${{ runner.temp }}/sms-failure.png
          retention-days: 7
          if-no-files-found: warn

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Tkko/better-actions/.github/workflows/ci.yml@main
    with:
      # The plugin is Android-only.
      platforms: android
      integration-test-target: integration_test/smart_auth_test.dart
    permissions:
      contents: read
      pull-requests: read

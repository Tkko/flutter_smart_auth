name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: Tkko/better-actions/.github/workflows/ci.yml@main
    with:
      # The plugin is Android-only.
      platforms: android
      integration-test-target: integration_test/smart_auth_test.dart

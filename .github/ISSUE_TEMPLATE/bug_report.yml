name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: [bug]
assignees: [Tkko]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/Tkko/flutter_smart_auth/issues) first.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps (or code) that triggers the problem.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      description: A runnable snippet or a link to a minimal reproduction repository.
      render: dart
  - type: input
    id: version
    attributes:
      label: smart_auth version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device and OS version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: flutter doctor -v
      description: Paste the output of `flutter doctor -v`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs and extra context
      description: Drag and drop screenshots or recordings here, and paste relevant logs.
